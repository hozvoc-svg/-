# Publishes the static site on every push: copies the site files to the
# gh-pages branch, which GitHub Pages serves at https://<owner>.github.io/<repo>/.
# Note: GitHub Pages is static hosting, so the live AI demo (api/) needs Vercel.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/modern-website-sale-tictam]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html css js assets robots.txt sitemap.xml site.webmanifest .nojekyll _site/
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
