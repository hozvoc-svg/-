<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password — Muse</title>
  <meta name="description" content="Set a new password for your Muse account.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add('js');
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a href="index.html" class="logo" aria-label="Muse">
        <img src="assets/favicon.svg" alt="" width="28" height="28">
        <span>Muse</span>
      </a>
      <div class="nav__actions">
        <label class="sr-only" for="uiLang" data-i18n="ui_lang">Interface language</label>
        <select class="lang-select" id="uiLang" data-lang-picker></select>
        <button class="icon-btn" id="themeToggle" aria-label="Theme">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="auth">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="auth-card" id="resetCard">
      <h1 data-i18n="reset_title">Set a new password</h1>
      <p data-i18n="reset_sub">Choose a new password for your account.</p>
      <form id="resetForm" novalidate hidden>
        <label class="field"><span data-i18n="new_pw">New password</span><input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
        <button class="btn btn--primary btn--block" type="submit" id="resetSubmit" data-i18n="btn_save_pw">Save password</button>
      </form>
      <p class="form-msg" id="resetMsg" role="status" aria-live="polite"></p>
      <p class="auth-note"><a href="login.html" data-i18n="back_login">← Back to log in</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" defer></script>
  <script src="js/ui-i18n.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
