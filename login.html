<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Muse</title>
  <meta name="description" content="Log in or create a free Muse account and get 50 free credits.">
  <meta name="theme-color" content="#0b0d14">
  <meta property="og:title" content="Log in — Muse">
  <meta property="og:description" content="Log in or create a free Muse account and get 50 free credits.">
  <meta property="og:image" content="https://hozvoc-svg.github.io/-/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add('js');
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a href="index.html" class="logo" aria-label="Muse home">
        <img src="assets/favicon.svg" alt="" width="28" height="28">
        <span>Muse</span>
      </a>
      <nav class="nav__links" id="navLinks" aria-label="Primary">
        <a href="index.html#features">Features</a>
        <a href="index.html#demo">Try it</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
        <a href="login.html" class="nav__login">Log in</a>
      </nav>
      <div class="nav__actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a href="login.html?mode=signup" class="btn btn--primary btn--sm nav__cta">Start creating</a>
        <button class="icon-btn burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="auth">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="auth-card" id="authCard" data-mode="login">
      <h1 data-only="login">Welcome back</h1>
      <h1 data-only="signup" hidden>Create your account</h1>
      <p data-only="login">Log in to keep creating.</p>
      <p data-only="signup" hidden>Start with 50 free credits. No card required.</p>
      <div class="auth-tabs" role="tablist" aria-label="Account">
        <button type="button" role="tab" data-auth-tab="login" aria-selected="true" class="is-active">Log in</button>
        <button type="button" role="tab" data-auth-tab="signup" aria-selected="false">Sign up</button>
      </div>
      <button type="button" class="btn btn--ghost btn--block">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div class="divider">or with email</div>
      <form id="authForm" novalidate>
        <label class="field" data-only="signup" hidden>Full name<input type="text" name="name" autocomplete="name" required minlength="2"></label>
        <label class="field">Email<input type="email" name="email" autocomplete="email" required></label>
        <label class="field">Password<input type="password" name="password" autocomplete="current-password" required minlength="8"></label>
        <button class="btn btn--primary btn--block" type="submit" id="authSubmit">Log in</button>
        <p class="form-msg" id="authMsg" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-note" data-only="signup" hidden>By signing up you agree to our <a href="terms.html" style="color:var(--accent)">Terms</a> and <a href="privacy.html" style="color:var(--accent)">Privacy Policy</a>.</p>
    </div>
  </main>

    <script src="js/main.js" defer></script>
</body>
</html>
